<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件管理</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; margin: 40px; }
    .uploader {
      margin-top: 20px; border: 2px dashed #bbb; border-radius: 8px; padding: 24px;
      text-align: center; color: #666; transition: all .2s ease-in-out;
    }
    .uploader.dragging { border-color: #409eff; background: #f0f9ff; color: #333; }
    .uploader .btn {
      display: inline-block; margin-top: 8px; padding: 8px 14px; background: #409eff; color: #fff;
      border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .hint { color: #999; font-size: 12px; margin-top: 6px; }
    .error { color: #d93025; margin-top: 10px; }
    .success { color: #2e7d32; margin-top: 10px; }

    .files-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      grid-gap: 15px;
    }
    .file-item {
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 12px;
      transition: all 0.3s;
    }
    .file-item:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .file-actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
    }
    .file-actions a {
      color: #409eff;
      text-decoration: none;
      font-size: 14px;
    }
    .file-actions a.delete {
      color: #f56c6c;
    }
    .file-info {
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>文件管理</h1>
  <div id="app">
    <div class="uploader" :class="{ dragging }"
         @dragover.prevent="onDragOver"
         @dragleave.prevent="onDragLeave"
         @drop.prevent="onDrop">
      <div>拖拽 CSV 文件到此处，或</div>
      <label class="btn">
        点击选择
        <input type="file" accept=".csv" @change="onSelect" hidden />
      </label>
      <div class="hint">仅支持 .csv 文件</div>
    </div>

    <div v-if="error" class="error">{{ error }}</div>
    <div v-if="success" class="success">{{ success }}</div>

    <h2 style="margin-top: 24px;">已上传文件</h2>

    <div v-if="files.length > 0" class="files-grid">
      <div class="file-item" v-for="file in sortedFiles" :key="file.name">
        <div class="file-name">
          <a :href="file.path" target="_blank"><strong>{{ file.name }}</strong></a>
        </div>
        <div class="file-info">
          <span>{{ formatSize(file.size) }}</span>
          <span>{{ formatDate(file.modified) }}</span>
        </div>
        <div class="file-actions">
          <a :href="file.path" target="_blank">下载</a>
            <a :href="'/api/files/view/' + encodeURIComponent(file.name)" target="_blank">查看</a>
          <a href="javascript:void(0)" class="delete" @click="deleteFile(file.name)">删除</a>
        </div>
      </div>
    </div>
    <div v-else style="color:#aaa;margin-top:16px;">暂无已上传文件</div>
  </div>

  <script src="/static/js/utils.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          dragging: false,
          error: '',
          success: '',
          files: [],
          username: ''
        };
      },
      mounted() {
        // 检查用户登录状态并加载文件列表
        this.loadFiles();

        // 处理与父页面的通信
        if (window.AuthUtils) {
          AuthUtils.handleParentCommunication((username) => {
            this.username = username;
          });
        }
      },
      methods: {
        formatSize(bytes) {
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
          return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        },
        formatDate(timestamp) {
          const date = new Date(timestamp);
          return date.getFullYear() + '-' +
                 String(date.getMonth() + 1).padStart(2, '0') + '-' +
                 String(date.getDate()).padStart(2, '0') + ' ' +
                 String(date.getHours()).padStart(2, '0') + ':' +
                 String(date.getMinutes()).padStart(2, '0') + ':' +
                 String(date.getSeconds()).padStart(2, '0');
        },
        async loadFiles() {
          try {
            const response = await fetch('/api/files', {
              credentials: 'include'
            });

            if (response.status === 401) {
              // 用户未登录，重定向到登录页面
              window.location.href = '/static/login.html';
              return;
            }

            const data = await response.json();
            if (data && data.files) {
              this.files = data.files;
            }
          } catch (err) {
            console.error('获取文件列表失败：', err);
            this.error = '获取文件列表失败';
          }
        },
        onDragOver() {
          this.dragging = true;
        },
        onDragLeave() {
          this.dragging = false;
        },
        async onDrop(e) {
          this.dragging = false;
          const file = e.dataTransfer.files[0];
          if (file && file.name.endsWith('.csv')) {
            await this.uploadFile(file);
          } else {
            this.error = '请上传 .csv 文件';
          }
        },
        onSelect(e) {
          const file = e.target.files[0];
          if (file && file.name.endsWith('.csv')) {
            this.uploadFile(file);
          } else {
            this.error = '请上传 .csv 文件';
          }
        },
        async uploadFile(file) {
          this.error = '';
          this.success = '';

          const formData = new FormData();
          formData.append('file', file);

          try {
            const response = await fetch('/api/files/upload', {
              method: 'POST',
              body: formData,
              credentials: 'include'
            });

            if (response.ok) {
              const data = await response.json();
              if (data && data.success) {
                this.success = data.message || '文件上传成功';
                // 更新文件列表
                this.loadFiles();
              } else {
                this.error = data.detail || '上传失败';
              }
            } else if (response.status === 401) {
              // 用户未登录，重定向到登录页面
              window.location.href = '/static/login.html';
            } else {
              const errorData = await response.json();
              this.error = errorData.detail || '上传失败';
            }
          } catch (err) {
            console.error('上传失败：', err);
            this.error = '上传失败';
          }
        },
        async deleteFile(filename) {
          if (!confirm(`确定要删除文件 "${filename}" 吗？`)) return;

          try {
            const response = await fetch(`/api/files/${encodeURIComponent(filename)}`, {
              method: 'DELETE',
              credentials: 'include'
            });

            if (response.ok) {
              const data = await response.json();
              if (data && data.success) {
                this.success = data.message || `文件 "${filename}" 已删除`;
                // 更新文件列表
                this.loadFiles();
              } else {
                this.error = data.detail || '删除失败';
              }
            } else if (response.status === 401) {
              window.location.href = '/static/login.html';
            } else if (response.status === 404) {
              this.error = '文件不存在';
            } else {
              const errorData = await response.json();
              this.error = errorData.detail || '删除文件失败';
            }
          } catch (err) {
            console.error('删除文件失败：', err);
            this.error = '删除文件失败';
          }
        }
      },
      computed: {
        sortedFiles() {
          return this.files.slice().sort((a, b) => new Date(b.modified) - new Date(a.modified));
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
