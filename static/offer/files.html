<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文件管理</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; margin: 40px; }
    .uploader {
      margin-top: 20px; border: 2px dashed #bbb; border-radius: 8px; padding: 24px;
      text-align: center; color: #666; transition: all .2s ease-in-out;
    }
    .uploader.dragging { border-color: #409eff; background: #f0f9ff; color: #333; }
    .uploader .btn {
      display: inline-block; margin-top: 8px; padding: 8px 14px; background: #409eff; color: #fff;
      border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .hint { color: #999; font-size: 12px; margin-top: 6px; }
    .error { color: #d93025; margin-top: 10px; }
    .success { color: #2e7d32; margin-top: 10px; }
    ul.files { margin-top: 16px; padding-left: 18px; }
    ul.files li { margin: 4px 0; }
    ul.files small { color: #888; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>文件管理</h1>
  <div id="app">
    <div class="uploader" :class="{ dragging }"
         @dragover.prevent="onDragOver"
         @dragleave.prevent="onDragLeave"
         @drop.prevent="onDrop">
      <div>拖拽 CSV 文件到此处，或</div>
      <label class="btn">
        点击选择
        <input type="file" accept=".csv" @change="onSelect" hidden />
      </label>
      <div class="hint">仅支持 .csv 文件</div>
    </div>

    <div v-if="error" class="error">{{ error }}</div>
    <div v-if="success" class="success">{{ success }}</div>

    <ul class="files" v-if="files.length">
      <li v-for="file in files" :key="file.name">
        <strong>{{ file.name }}</strong>
        <small>({{ file.size }} bytes)</small>
      </li>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          dragging: false,
          error: '',
          success: '',
          files: [],
          username: ''
        };
      },
      mounted() {
        // 检查用户登录状态
        fetch('/api/files', {
          credentials: 'include'
        })
        .then(response => {
          if (response.status === 401) {
            // 用户未登录，重定向到登录页面
            window.location.href = '/static/login.html';
            return;
          }
          return response.json();
        })
        .then(data => {
          if (data && data.files) {
            this.files = data.files;
          }
        })
        .catch(err => {
          console.error('获取文件列表失败：', err);
          this.error = '获取文件列表失败';
        });

        // 监听来自父页面的消息
        window.addEventListener('message', (event) => {
            if (event.data.type === 'USER_INFO') {
                // 接收父页面发送的用户信息
                this.username = event.data.username;
            }
        });

        // 请求父页面发送用户信息
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({type: 'GET_USER_INFO'}, '*');
        }
      },
      methods: {
        onDragOver() {
          this.dragging = true;
        },
        onDragLeave() {
          this.dragging = false;
        },
        async onDrop(e) {
          this.dragging = false;
          const file = e.dataTransfer.files[0];
          if (file && file.name.endsWith('.csv')) {
            await this.uploadFile(file);
          } else {
            this.error = '请上传 .csv 文件';
          }
        },
        onSelect(e) {
          const file = e.target.files[0];
          if (file && file.name.endsWith('.csv')) {
            this.uploadFile(file);
          } else {
            this.error = '请上传 .csv 文件';
          }
        },
        async uploadFile(file) {
          this.error = '';
          this.success = '';

          const formData = new FormData();
          formData.append('file', file);

          try {
            const response = await fetch('/api/files/upload', {
              method: 'POST',
              body: formData,
              credentials: 'include'
            });

            if (response.ok) {
              this.success = '文件上传成功';
              // 更新文件列表
              const data = await response.json();
              if (data && data.files) {
                this.files = data.files;
              }
            } else if (response.status === 401) {
              // 用户未登录，重定向到登录页面
              window.location.href = '/static/login.html';
            } else {
              this.error = '上传失败';
            }
          } catch (err) {
            console.error('上传失败：', err);
            this.error = '上传失败';
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
