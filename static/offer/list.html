<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Offer 列表</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="../js/utils.js"></script>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<div id="app">
    <div class="page-content">
        <h2>Offer 列表</h2>
        <table style="width:100%;margin-top:24px;">
            <thead>
                <tr><th>标题</th><th>描述</th></tr>
            </thead>
            <tbody>
                <tr v-for="offer in offers" :key="offer.title">
                    <td>{{ offer.title }}</td>
                    <td>{{ offer.desc }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            offers: [],
            username: ''
        }
    },
    async mounted() {
        try {
            // 使用统一的认证验证
            const response = await AuthUtils.validateAuth('/api/offer/list');
            
            if (!response.success) {
                window.location.href = '/static/login.html';
                return;
            }
            
            // 使用统一的错误处理
            const data = await ErrorHandler.handleAsyncCall(() => 
                fetch('/api/offer/list', { credentials: 'include' })
            );
            
            this.offers = data.offers || [];
            
            if (data.success) {
                this.username = data.username || '';
            }
        } catch (error) {
            ErrorHandler.handleGlobalError(error);
            return;
        }
        
        // 使用统一的父子页面通信处理
        AuthUtils.handleParentCommunication((username) => {
            this.username = username;
        });
    }
}).mount('#app');
</script>
</body>
</html>
