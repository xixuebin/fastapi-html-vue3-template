<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>创建 Offer</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<div id="app">
    <div class="page-content">
        <h2>创建 Offer</h2>
        <form @submit.prevent="submitOffer">
            <div class="form-group">
                <label for="title">标题：</label>
                <input type="text" id="title" v-model="title" required>
            </div>
            <div class="form-group">
                <label for="desc">描述：</label>
                <textarea id="desc" v-model="desc" required></textarea>
            </div>
            <button type="submit">创建 Offer</button>
        </form>
        <div v-if="message" class="message">{{ message }}</div>
        <div v-if="error" class="error">{{ error }}</div>
    </div>
</div>
<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            title: '',
            desc: '',
            message: '',
            error: '',
            username: ''
        }
    },
    async mounted() {
        // 检查用户登录状态
        const authResult = await AuthUtils.checkLoginStatus('/api/offer/list');
        
        if (authResult.loggedIn) {
            this.username = authResult.username;
        }
        
        // 处理与父页面的通信
        AuthUtils.handleParentCommunication((username) => {
            this.username = username;
        });
    },
    methods: {
        async submitOffer() {
            this.message = '';
            this.error = '';

            try {
                const response = await fetch('/offer/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `title=${encodeURIComponent(this.title)}&desc=${encodeURIComponent(this.desc)}`,
                    credentials: 'include'
                });

                if (response.status === 401) {
                    // 用户未登录，重定向到登录页面
                    window.location.href = '/static/login.html';
                    return;
                }

                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    this.message = 'Offer 创建成功';
                    this.title = '';
                    this.desc = '';
                }
            } catch (error) {
                console.error('创建 Offer 时出错：', error);
                this.error = '创建 Offer 失败';
            }
        }
    }
}).mount('#app');
</script>
    <script src="/js/utils.js"></script>
</body>
</html>
