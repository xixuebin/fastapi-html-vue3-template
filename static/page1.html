<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>页面一</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<div id="app">
    <div class="page-content">
        <h2>页面一</h2>
        <div v-if="username">欢迎，{{ username }}！</div>
        <div v-else class="error">未登录</div>
    </div>
</div>
<script src="/js/utils.js"></script>
<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            username: ''
        }
    },
    async mounted() {
        // 检查用户登录状态
        const authResult = await AuthUtils.checkLoginStatus('/api/page1');
        
        if (authResult.loggedIn) {
            this.username = authResult.username;
        }
        
        // 处理与父页面的通信
        AuthUtils.handleParentCommunication((username) => {
            this.username = username;
        });
    }
}).mount('#app');
</script>
</body>
</html>
