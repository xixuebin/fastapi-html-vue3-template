<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>页面一</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
<div id="app">
    <div class="page-content">
        <h2>页面一</h2>
        <div v-if="username">欢迎，{{ username }}！</div>
        <div v-else class="error">未登录</div>
    </div>
</div>
<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            username: ''
        }
    },
    async mounted() {
        // 检查用户登录状态
        try {
            const response = await fetch('/api/page1', {
                credentials: 'include'
            });
            
            if (response.status === 401) {
                // 用户未登录，重定向到登录页面
                window.location.href = '/static/login.html';
                return;
            }
            
            const data = await response.json();
            if (data.success) {
                this.username = data.username;
            } else {
                window.location.href = '/static/login.html';
            }
        } catch (error) {
            console.error('检查登录状态时出错:', error);
            window.location.href = '/static/login.html';
        }
    }
}).mount('#app');
</script>
</body>
</html>
