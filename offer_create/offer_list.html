<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Offer 列表</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-content">
        <h2>Offer 列表</h2>
        <table style="width:100%;margin-top:24px;">
            <thead>
                <tr><th>标题</th><th>描述</th></tr>
            </thead>
            <tbody>
                {% for offer in offers %}
                <tr>
                    <td>{{ offer.title }}</td>
                    <td>{{ offer.desc }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
